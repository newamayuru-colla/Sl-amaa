<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AMAA — Premium Media Downloader</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eef5ff;
  --card:rgba(255,255,255,.8);
  --text:#0f172a;
  --muted:#64748b;
  --primary:#2563eb;
  --primary2:#38bdf8;
  --shadow:0 18px 45px rgba(0,0,0,.10);
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Poppins,sans-serif;
  background:linear-gradient(180deg,#eef5ff,#f8fbff);
  color:var(--text);
}

.container{width:min(1200px,95%);margin:auto}

/* HEADER */
header{
  position:sticky;top:0;
  background:rgba(255,255,255,.7);
  backdrop-filter:blur(10px);
  border-bottom:1px solid #eee;
  z-index:10;
}

.nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 0;
}

.logo{
  width:45px;height:45px;
  border-radius:14px;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  display:grid;place-items:center;
  color:#fff;font-weight:800;
}

/* BUTTONS */
.pill,.tab,.btn{
  border:none;
  cursor:pointer;
  border-radius:999px;
  padding:10px 16px;
  font-weight:700;
  transition:.2s;
}

.pill{
  background:#fff;
  box-shadow:var(--shadow);
}

.pill.active{
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  color:#fff;
}

.tab.active{
  background:#22c55e;
  color:#fff;
}

/* HERO */
.hero{padding:20px 0}

.hero-card{
  background:rgba(255,255,255,.8);
  padding:20px;
  border-radius:25px;
  box-shadow:var(--shadow);
}

.hero h2{
  font-size:2rem;
  margin-bottom:10px;
}

.hero span{
  color:var(--primary);
}

/* SEARCH */
.search input{
  width:100%;
  padding:15px;
  border-radius:14px;
  border:none;
  outline:none;
  box-shadow:var(--shadow);
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin:20px 0;
}

.card{
  background:var(--card);
  border-radius:20px;
  overflow:hidden;
  box-shadow:var(--shadow);
}

.thumb img,.thumb video{
  width:100%;
  height:220px;
  object-fit:cover;
}

.content{padding:12px}

.card-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.btn-primary{
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  color:#fff;
}

.btn-secondary{
  background:#fff;
}

/* LOADING */
.loading,.error,.empty{
  grid-column:1/-1;
  text-align:center;
  padding:40px;
  background:#fff;
  border-radius:20px;
}

/* RESPONSIVE */
@media(max-width:900px){
  .grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:600px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<div class="container nav">
  <div style="display:flex;gap:10px;align-items:center">
    <div class="logo">A</div>
    <b>AMAA</b>
  </div>

  <div style="display:flex;gap:10px">
    <button class="pill" id="themeBtn">🌙</button>
    <button class="pill" id="refreshBtn">↻</button>
  </div>
</div>
</header>

<main class="container">

<section class="hero">
<div class="hero-card">

<h2><span>Premium</span> Media Downloader</h2>

<input id="searchInput" class="search" placeholder="Search photos or videos..." />

<div style="display:flex;gap:10px;margin-top:15px;flex-wrap:wrap">
  <button class="pill active" data-topic="nature">Nature</button>
  <button class="pill" data-topic="city">City</button>
  <button class="pill" data-topic="travel">Travel</button>
</div>

<div style="margin-top:15px">
  <button class="tab" id="photosTab">Photos</button>
  <button class="tab" id="videosTab">Videos</button>
</div>

</div>
</section>

<section class="grid" id="grid">
<div class="loading">Loading...</div>
</section>

</main>

<script>

const API_KEY = "W2uSxyPjiN6rfcFlJPRdV0x7wAXTXJsyDSBqyyok1nFdMboDtqBUexrQ";

const grid = document.getElementById("grid");
const searchInput = document.getElementById("searchInput");
const photosTab = document.getElementById("photosTab");
const videosTab = document.getElementById("videosTab");
const refreshBtn = document.getElementById("refreshBtn");
const themeBtn = document.getElementById("themeBtn");
const topicButtons = document.querySelectorAll("[data-topic]");

let mode = "photos";
let query = "nature";
let debounce;

function setMode(m){
  mode = m;
  photosTab.classList.toggle("active",m==="photos");
  videosTab.classList.toggle("active",m==="videos");
}

/* THEME */
themeBtn.onclick=()=>{
  document.body.classList.toggle("dark");
};

/* FETCH */
async function fetchData(url){
  const res = await fetch(url,{
    headers:{Authorization:API_KEY}
  });
  return await res.json();
}

/* SAFE VIDEO */
function getVideo(video){
  const files = video.video_files?.filter(f=>f.link) || [];
  if(!files.length) return null;
  return files[files.length-1];
}

/* RENDER PHOTOS */
function renderPhotos(data){
  if(!data.length){
    grid.innerHTML="<div class='empty'>No Photos</div>";
    return;
  }

  grid.innerHTML = data.map(p=>`
    <div class="card">
      <div class="thumb">
        <img src="${p.src.medium}" />
      </div>
      <div class="content">
        <b>${p.photographer}</b>
        <div class="card-actions">
          <a class="btn btn-primary" href="${p.src.original}" target="_blank">Open</a>
          <a class="btn btn-secondary" href="${p.src.original}" download>Download</a>
        </div>
      </div>
    </div>
  `).join("");
}

/* RENDER VIDEOS */
function renderVideos(data){
  if(!data.length){
    grid.innerHTML="<div class='empty'>No Videos</div>";
    return;
  }

  grid.innerHTML = data.map(v=>{
    const file = getVideo(v);
    if(!file) return "";

    return `
    <div class="card">
      <div class="thumb">
        <video controls preload="metadata">
          <source src="${file.link}">
        </video>
      </div>
      <div class="content">
        <b>${v.user?.name || "User"}</b>
        <div class="card-actions">
          <a class="btn btn-primary" href="${file.link}" target="_blank">Open</a>
          <a class="btn btn-secondary" href="${file.link}" download>Download</a>
        </div>
      </div>
    </div>
    `;
  }).join("");
}

/* LOAD */
async function load(){

  const q = encodeURIComponent(query);

  grid.innerHTML="<div class='loading'>Loading...</div>";

  const url = mode==="photos"
  ? `https://api.pexels.com/v1/search?query=${q}&per_page=12`
  : `https://api.pexels.com/videos/search?query=${q}&per_page=12`;

  const data = await fetchData(url);

  if(mode==="photos") renderPhotos(data.photos||[]);
  else renderVideos(data.videos||[]);
}

/* EVENTS */
photosTab.onclick=()=>{
  setMode("photos");
  load();
};

videosTab.onclick=()=>{
  setMode("videos");
  load();
};

/* DEBOUNCE SEARCH */
searchInput.addEventListener("input",()=>{
  clearTimeout(debounce);
  debounce=setTimeout(()=>{
    query = searchInput.value || "nature";
    load();
  },400);
});

/* TOPIC */
topicButtons.forEach(btn=>{
  btn.onclick=()=>{
    query=btn.dataset.topic;
    searchInput.value=query;
    load();
  };
});

/* REFRESH LOCK */
refreshBtn.onclick=async()=>{
  refreshBtn.disabled=true;
  await load();
  setTimeout(()=>refreshBtn.disabled=false,800);
};

/* START */
load();

</script>

</body>
</html>
