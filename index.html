<!-- ================= PREMIUM CSS ================= -->

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:
  radial-gradient(circle at top left,#1f1147,#09090f 50%);
  color:white;
  min-height:100vh;
  padding:20px;
}

/* SEARCH + TOP */

.topbar{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

input,
select,
button{
  border:none;
  outline:none;
}

input,
select{
  background:rgba(255,255,255,0.08);
  color:white;
  padding:14px 16px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,0.08);
}

input::placeholder{
  color:rgba(255,255,255,0.6);
}

button{
  cursor:pointer;
}

/* STATS */

.stats-container{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:16px;
  margin-bottom:25px;
}

.stat-box{
  background:rgba(255,255,255,0.07);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:22px;
  padding:22px;
  text-align:center;
  backdrop-filter:blur(14px);
  box-shadow:0 10px 30px rgba(0,0,0,0.25);
  transition:0.3s;
}

.stat-box:hover{
  transform:translateY(-5px);
}

.stat-box h2{
  font-size:30px;
  margin-bottom:10px;
}

.stat-box p{
  color:rgba(255,255,255,0.7);
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;
}

/* CARD */

.card{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:24px;
  overflow:hidden;
  backdrop-filter:blur(14px);
  transition:0.35s;
  box-shadow:0 12px 35px rgba(0,0,0,0.25);
}

.card:hover{
  transform:translateY(-6px);
  box-shadow:0 20px 45px rgba(0,0,0,0.35);
}

.thumb{
  position:relative;
  overflow:hidden;
}

.thumb img,
.thumb video{
  width:100%;
  height:240px;
  object-fit:cover;
  display:block;
  transition:0.5s;
}

.card:hover img,
.card:hover video{
  transform:scale(1.05);
}

.badge{
  position:absolute;
  top:14px;
  left:14px;
  background:rgba(0,0,0,0.6);
  padding:8px 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:bold;
}

.quality{
  position:absolute;
  bottom:14px;
  right:14px;
  background:rgba(255,255,255,0.12);
  padding:8px 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:bold;
}

/* CONTENT */

.content{
  padding:18px;
}

.content h3{
  margin-bottom:8px;
  font-size:18px;
}

.content p{
  color:rgba(255,255,255,0.72);
  font-size:14px;
  line-height:1.5;
}

/* BUTTONS */

.card-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:16px;
}

.btn{
  flex:1;
  position:relative;
  overflow:hidden;
  border:none;
  border-radius:14px;
  padding:12px 16px;
  font-size:14px;
  font-weight:bold;
  text-decoration:none;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:0.25s;
}

.btn::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,0.2),
    transparent
  );
  transform:translateX(-100%);
  transition:0.6s;
}

.btn:hover::before{
  transform:translateX(100%);
}

.btn-primary{
  background:linear-gradient(
    135deg,
    #6d5dfc,
    #8c52ff
  );
  color:white;
  box-shadow:
  0 10px 25px rgba(108,92,255,0.35);
}

.btn-primary:hover{
  transform:translateY(-3px);
}

.btn-secondary{
  background:rgba(255,255,255,0.08);
  color:white;
  border:1px solid rgba(255,255,255,0.12);
}

.btn-secondary:hover{
  transform:translateY(-3px);
}

.btn-secondary.active{
  background:linear-gradient(
    135deg,
    #ff416c,
    #ff4b2b
  );
  border:none;
}

/* TOPIC BUTTONS */

.topics{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.topic-btn{
  background:rgba(255,255,255,0.08);
  color:white;
  padding:12px 16px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,0.08);
  transition:0.25s;
}

.topic-btn.active,
.topic-btn:hover{
  background:linear-gradient(
    135deg,
    #6d5dfc,
    #8c52ff
  );
}

/* LOADING */

.loading,
.error,
.empty{
  text-align:center;
  padding:60px 20px;
  background:rgba(255,255,255,0.05);
  border-radius:24px;
}

.muted{
  margin-top:10px;
  color:rgba(255,255,255,0.65);
}

/* SCROLL */

::-webkit-scrollbar{
  width:10px;
}

::-webkit-scrollbar-track{
  background:#111;
}

::-webkit-scrollbar-thumb{
  background:linear-gradient(
    #6d5dfc,
    #8c52ff
  );
  border-radius:999px;
}

/* MOBILE */

@media(max-width:768px){

  .card-actions{
    flex-direction:column;
  }

  .btn{
    width:100%;
  }

}

</style>

<!-- ================= PREMIUM SCRIPT ================= -->

<script>

const API_KEY = "YOUR_PEXELS_API_KEY";

const grid = document.getElementById("grid");
const searchInput = document.getElementById("searchInput");
const photoQuality = document.getElementById("photoQuality");
const videoQuality = document.getElementById("videoQuality");

let currentMode = "photos";

const cache = new Map();

/* STATS */

function getDownloadCount(){

  const stored =
  localStorage.getItem("downloads");

  if(stored) return parseInt(stored);

  const seed =
  Math.floor(Math.random()*50000)+5000;

  localStorage.setItem("downloads",seed);

  return seed;
}

function updateStats(){

  const visitors =
  Math.floor(Math.random()*9000)+1000;

  document.getElementById(
    "visitorCount"
  ).innerText =
  visitors.toLocaleString();

  document.getElementById(
    "downloadCount"
  ).innerText =
  getDownloadCount().toLocaleString();

  document.getElementById(
    "favoriteCount"
  ).innerText =
  getFavoriteCount().toLocaleString();
}

setInterval(updateStats,4000);

updateStats();

/* FAVORITES */

function favKey(type,id){
  return `fav_${type}_${id}`;
}

function isFavorite(type,id){
  return localStorage.getItem(
    favKey(type,id)
  ) !== null;
}

function getFavoriteCount(){

  return Object.keys(localStorage)
  .filter(x=>x.startsWith("fav_"))
  .length;
}

function toggleFavorite(item){

  const key =
  favKey(item.type,item.id);

  if(localStorage.getItem(key)){

    localStorage.removeItem(key);

  }else{

    localStorage.setItem(
      key,
      JSON.stringify(item)
    );
  }

  updateStats();
  updateFavoriteButtons();
}

function updateFavoriteButtons(){

  document
  .querySelectorAll("[data-fav-btn]")
  .forEach(btn=>{

    const active =
    isFavorite(
      btn.dataset.type,
      btn.dataset.id
    );

    btn.classList.toggle(
      "active",
      active
    );

    btn.innerHTML =
    active
    ? "♥ Favorited"
    : "♡ Favorite";

  });
}

/* HELPERS */

function loadingState(text){

  grid.innerHTML = `
  <div class="loading">
    <strong>${text}</strong>
    <div class="muted">
      Fetching premium content...
    </div>
  </div>
  `;
}

function errorState(msg){

  grid.innerHTML = `
  <div class="error">
    <strong>Error</strong>
    <div class="muted">${msg}</div>
  </div>
  `;
}

function emptyState(msg){

  grid.innerHTML = `
  <div class="empty">
    <strong>No results</strong>
    <div class="muted">${msg}</div>
  </div>
  `;
}

/* PHOTO QUALITY */

function getPhotoUrl(photo){

  return photoQuality.value === "original"
  ? photo.src.original
  : photo.src[photoQuality.value]
  || photo.src.large2x
  || photo.src.large;
}

/* VIDEO QUALITY */

function getBestVideoFile(video){

  const files =
  [...(video.video_files || [])]
  .filter(x=>x.link)
  .sort((a,b)=>
    (a.width||0)-(b.width||0)
  );

  if(!files.length) return null;

  return files[files.length-1];
}

/* DOWNLOAD */

async function downloadFile(url,name){

  try{

    const res = await fetch(url);

    const blob =
    await res.blob();

    const blobUrl =
    URL.createObjectURL(blob);

    const a =
    document.createElement("a");

    a.href = blobUrl;
    a.download = name;

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(blobUrl);

    const next =
    getDownloadCount()+1;

    localStorage.setItem(
      "downloads",
      next
    );

    updateStats();

  }catch(err){

    window.open(url);

  }
}

/* CACHE FETCH */

async function fetchWithCache(url){

  if(cache.has(url))
  return cache.get(url);

  const res = await fetch(url,{
    headers:{
      Authorization:API_KEY
    }
  });

  if(!res.ok)
  throw new Error();

  const data =
  await res.json();

  cache.set(url,data);

  return data;
}

/* RENDER PHOTOS */

function renderPhotos(photos){

  if(!photos.length){
    emptyState("Try another keyword");
    return;
  }

  grid.innerHTML =
  photos.map(photo=>{

    const img =
    getPhotoUrl(photo);

    const fav =
    isFavorite(
      "photo",
      photo.id
    );

    return `
    <article class="card">

      <div class="thumb">

        <img
          src="${img}"
          loading="lazy"
        >

        <div class="badge">
          Photo
        </div>

        <div class="quality">
          HD
        </div>

      </div>

      <div class="content">

        <h3>
          ${photo.photographer}
        </h3>

        <p>
          ${photo.alt || "Premium photo"}
        </p>

        <div class="card-actions">

          <a
            class="btn btn-primary"
            href="${img}"
            target="_blank"
          >
            Open
          </a>

          <button
            class="btn btn-secondary"
            onclick="
              downloadFile(
                '${img}',
                'photo-${photo.id}.jpg'
              )
            "
          >
            ⬇ Download
          </button>

          <button
            class="
            btn
            btn-secondary
            ${fav ? "active" : ""}
            "
            data-fav-btn
            data-type="photo"
            data-id="${photo.id}"
            onclick='toggleFavorite({
              type:"photo",
              id:"${photo.id}"
            })'
          >
            ${fav
              ? "♥ Favorited"
              : "♡ Favorite"
            }
          </button>

        </div>

      </div>

    </article>
    `;

  }).join("");

  updateFavoriteButtons();
}

/* RENDER VIDEOS */

function renderVideos(videos){

  if(!videos.length){
    emptyState("Try another keyword");
    return;
  }

  grid.innerHTML =
  videos.map(video=>{

    const file =
    getBestVideoFile(video);

    const source =
    file ? file.link : "";

    const fav =
    isFavorite(
      "video",
      video.id
    );

    return `
    <article class="card">

      <div class="thumb">

        <video controls>
          <source
            src="${source}"
            type="video/mp4"
          >
        </video>

        <div class="badge">
          Video
        </div>

        <div class="quality">
          ${file?.width || "HD"}p
        </div>

      </div>

      <div class="content">

        <h3>
          ${video.user?.name || "Creator"}
        </h3>

        <p>
          Premium live video.
        </p>

        <div class="card-actions">

          <a
            class="btn btn-primary"
            href="${source}"
            target="_blank"
          >
            Open
          </a>

          <button
            class="btn btn-secondary"
            onclick="
              downloadFile(
                '${source}',
                'video-${video.id}.mp4'
              )
            "
          >
            ⬇ Download
          </button>

          <button
            class="
            btn
            btn-secondary
            ${fav ? "active" : ""}
            "
            data-fav-btn
            data-type="video"
            data-id="${video.id}"
            onclick='toggleFavorite({
              type:"video",
              id:"${video.id}"
            })'
          >
            ${fav
              ? "♥ Favorited"
              : "♡ Favorite"
            }
          </button>

        </div>

      </div>

    </article>
    `;

  }).join("");

  updateFavoriteButtons();
}

/* LOAD */

async function loadContent(){

  const query =
  (searchInput.value || "nature")
  .trim();

  loadingState(
    currentMode === "photos"
    ? "Loading Photos..."
    : "Loading Videos..."
  );

  try{

    const endpoint =
    currentMode === "photos"
    ? `https://api.pexels.com/v1/search?query=${encodeURIComponent(query)}&per_page=12`
    : `https://api.pexels.com/videos/search?query=${encodeURIComponent(query)}&per_page=12`;

    const data =
    await fetchWithCache(endpoint);

    if(currentMode === "photos"){

      renderPhotos(data.photos || []);

    }else{

      renderVideos(data.videos || []);
    }

  }catch(err){

    errorState(
      "Check internet or API key"
    );
  }
}

/* START */

loadContent();

</script>
