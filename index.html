<script>
const API_KEY = "YOUR_PEXELS_API_KEY";

const grid = document.getElementById("grid");
const searchInput = document.getElementById("searchInput");
const photoQuality = document.getElementById("photoQuality");
const videoQuality = document.getElementById("videoQuality");
const photosTab = document.getElementById("photosTab");
const videosTab = document.getElementById("videosTab");
const refreshBtn = document.getElementById("refreshBtn");
const topicButtons = [...document.querySelectorAll("[data-topic]")];
const themeBtn = document.getElementById("themeBtn");

let currentMode = "photos";
let currentQuery = "nature";

const cache = new Map();
let abortController = null;
let debounceTimer = null;

/* ---------------- THEME ---------------- */

function applyTheme(theme) {
  document.body.classList.toggle("dark", theme === "dark");
  themeBtn.innerHTML = theme === "dark"
    ? "☀ Light"
    : "🌙 Dark";

  localStorage.setItem("amaa_theme", theme);
}

const savedTheme = localStorage.getItem("amaa_theme") || "dark";
applyTheme(savedTheme);

themeBtn.addEventListener("click", () => {
  const nextTheme = document.body.classList.contains("dark")
    ? "light"
    : "dark";

  applyTheme(nextTheme);
});

/* ---------------- PREMIUM STATS ---------------- */

function updatePremiumStats() {
  const visitors =
    Math.floor(Math.random() * 9000) + 1000;

  const downloads =
    Math.floor(Math.random() * 50000) + 5000;

  const favorites =
    Math.floor(Math.random() * 12000) + 1000;

  document.getElementById("visitorCount").innerText =
    visitors.toLocaleString();

  document.getElementById("downloadCount").innerText =
    downloads.toLocaleString();

  document.getElementById("favoriteCount").innerText =
    favorites.toLocaleString();
}

updatePremiumStats();

/* ---------------- HELPERS ---------------- */

function setActiveTopic(btn) {
  topicButtons.forEach(b =>
    b.classList.remove("active")
  );

  btn.classList.add("active");
}

function setMode(mode) {
  currentMode = mode;

  photosTab.classList.toggle(
    "active",
    mode === "photos"
  );

  videosTab.classList.toggle(
    "active",
    mode === "videos"
  );

  photoQuality.style.display =
    mode === "photos" ? "block" : "none";

  videoQuality.style.display =
    mode === "videos" ? "block" : "none";
}

function loadingState(text = "Loading...") {
  grid.innerHTML = `
    <div class="loading">
      <strong>${text}</strong>
      <div class="muted">
        Fetching live results from Pexels.
      </div>
    </div>
  `;
}

function errorState(message) {
  grid.innerHTML = `
    <div class="error">
      <strong>Something went wrong</strong>
      <div class="muted">${message}</div>
    </div>
  `;
}

function emptyState(message) {
  grid.innerHTML = `
    <div class="empty">
      <strong>No results found</strong>
      <div class="muted">${message}</div>
    </div>
  `;
}

function debounceLoad() {
  clearTimeout(debounceTimer);

  debounceTimer = setTimeout(() => {
    loadContent();
  }, 300);
}

/* ---------------- PHOTO QUALITY ---------------- */

function getPhotoUrl(photo) {
  return photoQuality.value === "original"
    ? photo.src.original
    : photo.src[photoQuality.value] ||
        photo.src.large2x ||
        photo.src.large;
}

/* ---------------- VIDEO QUALITY ---------------- */

function getBestVideoFile(video) {
  const files = [...(video.video_files || [])]
    .filter(file => file.link)
    .sort(
      (a, b) =>
        (a.width || 0) - (b.width || 0)
    );

  if (!files.length) return null;

  const findClosest = targetWidth => {
    let best = files[0];

    let bestDiff = Math.abs(
      (best.width || 0) - targetWidth
    );

    for (const file of files) {
      const diff = Math.abs(
        (file.width || 0) - targetWidth
      );

      if (diff < bestDiff) {
        best = file;
        bestDiff = diff;
      }
    }

    return best;
  };

  if (videoQuality.value === "4k")
    return files[files.length - 1];

  if (videoQuality.value === "2k")
    return findClosest(2560);

  if (videoQuality.value === "1080")
    return findClosest(1920);

  if (videoQuality.value === "720")
    return findClosest(1280);

  return files[files.length - 1];
}

/* ---------------- DOWNLOAD ---------------- */

async function downloadFile(url, filename) {
  try {
    const response = await fetch(url);

    if (!response.ok)
      throw new Error("Bad response");

    const blob = await response.blob();

    const blobUrl =
      URL.createObjectURL(blob);

    const a = document.createElement("a");

    a.href = blobUrl;
    a.download = filename || "download";

    document.body.appendChild(a);

    a.click();

    a.remove();

    setTimeout(() => {
      URL.revokeObjectURL(blobUrl);
    }, 1000);

  } catch (err) {
    window.open(url, "_blank");
  }
}

/* ---------------- FETCH CACHE ---------------- */

async function fetchWithCache(url) {
  if (cache.has(url))
    return cache.get(url);

  if (abortController) {
    try {
      abortController.abort();
    } catch (e) {}
  }

  abortController = new AbortController();

  const res = await fetch(url, {
    headers: {
      Authorization: API_KEY
    },
    signal: abortController.signal
  });

  if (!res.ok)
    throw new Error("Request failed");

  const data = await res.json();

  cache.set(url, data);

  return data;
}

/* ---------------- RENDER PHOTOS ---------------- */

function renderPhotos(photos) {
  if (!photos.length) {
    emptyState("Try another keyword.");
    return;
  }

  grid.innerHTML = photos.map(photo => {

    const imgUrl = getPhotoUrl(photo);

    const photographer =
      photo.photographer ||
      "Unknown creator";

    const alt =
      (photo.alt || "Pexels photo")
      .replace(/"/g, "&quot;");

    return `
      <article class="card">
        <div class="thumb">
          <img
            src="${imgUrl}"
            alt="${alt}"
            loading="lazy"
          >

          <div class="badge">
            Photo
          </div>

          <div class="quality">
            ${
              photoQuality.options[
                photoQuality.selectedIndex
              ].text.replace(
                "Photo Quality: ",
                ""
              )
            }
          </div>
        </div>

        <div class="content">
          <h3>${photographer}</h3>

          <p>
            ${
              photo.alt ||
              "High quality premium photo."
            }
          </p>

          <div class="card-actions">

            <a
              class="btn btn-primary"
              href="${imgUrl}"
              target="_blank"
            >
              Open
            </a>

            <button
              class="btn btn-secondary"
              onclick="downloadFile(
                '${imgUrl}',
                'pexels-photo-${photo.id}.jpg'
              )"
            >
              ⬇ Download
            </button>

          </div>
        </div>
      </article>
    `;
  }).join("");
}

/* ---------------- RENDER VIDEOS ---------------- */

function renderVideos(videos) {
  if (!videos.length) {
    emptyState("Try another keyword.");
    return;
  }

  grid.innerHTML = videos.map(video => {

    const file =
      getBestVideoFile(video);

    const source =
      file ? file.link : "";

    const photographer =
      video.user?.name ||
      "Unknown creator";

    const qualityLabel =
      file
        ? `${file.width || "?"}px`
        : "Best";

    return `
      <article class="card">
        <div class="thumb">

          <video
            controls
            preload="metadata"
            poster="${video.image || ""}"
          >
            <source
              src="${source}"
              type="video/mp4"
            >
          </video>

          <div class="badge">
            Video
          </div>

          <div class="quality">
            ${qualityLabel}
          </div>

        </div>

        <div class="content">

          <h3>${photographer}</h3>

          <p>
            Live premium video preview.
          </p>

          <div class="card-actions">

            <a
              class="btn btn-primary"
              href="${source}"
              target="_blank"
            >
              Open
            </a>

            <button
              class="btn btn-secondary"
              onclick="downloadFile(
                '${source}',
                'pexels-video-${video.id}.mp4'
              )"
            >
              ⬇ Download
            </button>

          </div>

        </div>
      </article>
    `;
  }).join("");
}

/* ---------------- LOAD CONTENT ---------------- */

async function loadContent() {

  const query =
    (searchInput.value ||
      currentQuery ||
      "nature").trim();

  currentQuery = query;

  loadingState(
    currentMode === "photos"
      ? "Loading Photos..."
      : "Loading Videos..."
  );

  try {

    const endpoint =
      currentMode === "photos"
        ? `https://api.pexels.com/v1/search?query=${encodeURIComponent(query)}&per_page=12`
        : `https://api.pexels.com/videos/search?query=${encodeURIComponent(query)}&per_page=12`;

    const data =
      await fetchWithCache(endpoint);

    if (currentMode === "photos") {
      renderPhotos(data.photos || []);
    } else {
      renderVideos(data.videos || []);
    }

  } catch (err) {

    if (err.name === "AbortError")
      return;

    errorState(
      "Check internet connection or API key."
    );
  }
}

/* ---------------- EVENTS ---------------- */

photosTab.addEventListener("click", () => {
  setMode("photos");
  loadContent();
});

videosTab.addEventListener("click", () => {
  setMode("videos");
  loadContent();
});

refreshBtn.addEventListener("click", async () => {

  cache.clear();

  refreshBtn.disabled = true;

  refreshBtn.innerHTML =
    "⏳ Refreshing...";

  await loadContent();

  setTimeout(() => {

    refreshBtn.disabled = false;

    refreshBtn.innerHTML =
      "↻ Refresh";

  }, 500);
});

topicButtons.forEach(btn => {

  btn.addEventListener("click", () => {

    setActiveTopic(btn);

    searchInput.value =
      btn.dataset.topic;

    loadContent();
  });
});

searchInput.addEventListener(
  "input",
  debounceLoad
);

searchInput.addEventListener(
  "keydown",
  e => {
    if (e.key === "Enter") {
      loadContent();
    }
  }
);

photoQuality.addEventListener(
  "change",
  () => {
    if (currentMode === "photos") {
      loadContent();
    }
  }
);

videoQuality.addEventListener(
  "change",
  () => {
    if (currentMode === "videos") {
      loadContent();
    }
  }
);

/* ---------------- START ---------------- */

loadContent();

</script>
